name: Full Build

on:
  push:
    branches:
      - develop
      - master
      - os-4.0-dev
    tags:
      - "v*"
  schedule:
    # Run nightly at 8 PM ET (midnight UTC during EST, 1 AM UTC during EDT)
    # Using 1 AM UTC to cover EDT (daylight saving time)
    - cron: '0 1 * * *'
  pull_request:
    # Any base branch: this is the only macOS/Windows PR CI since Jenkins osx/windows were retired
    types: [ opened, reopened, synchronize ]
  workflow_dispatch:
    inputs:
      publish_to_s3:
        description: "Force S3 publishing even when not on develop"
        type: boolean
        required: false
        default: false
      skip_docker_trigger:
        description: "Skip downstream docker workflow trigger"
        type: boolean
        required: false
        default: false
      jobs:
        description: "Comma-separated list of jobs to run (e.g. 'linux-build,windows-build'). Leave empty to run all."
        required: false
        default: ""
      conan_build_all:
        description: "Comma-separated list of platforms to force building all conan dependencies from source for (to fix GLIBC ABI mismatches with conancenter binaries, on centos for eg). Leave empty to disable."
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      publish_to_s3:
        type: boolean
        required: false
        default: false
      skip_docker_trigger:
        type: boolean
        required: false
        default: false
      jobs:
        type: string
        required: false
        default: ""
      conan_build_all:
        type: string
        required: false
        default: ""

concurrency:
  group: full-build-${{ github.ref }}
  # A new push to a PR supersedes its running build; develop, master, tags and nightlies still queue
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
  packages: write
  id-token: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BUILD_TYPE: Release
  OPENSTUDIO_BUILD: build
  PYTHON_REQUIRED_VERSION: "3.12.2"
  SDKROOT: /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
  AWS_S3_BUCKET: openstudio-ci-builds
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  TEST_DASHBOARD_RELATIVE: Testing/dashboard/test-dashboard.md
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "3"
  CCACHE_MAXSIZE: "10G"
  CCACHE_DEPEND: "true"
  CCACHE_NOHASHDIR: "true"
  # mtime-based compiler check is unreliable across fresh runner VMs, where the compiler binary's mtime can differ even though its content doesn't
  CCACHE_COMPILERCHECK: content
  ENABLE_PCH: ON
  NINJA_STATUS: "[%p][%f/%t | %es elapsed | %o objs/sec] "
  # Put [skip tests] in the commit message to skip the CTest steps (only on push: always false on pull requests)
  SKIP_TESTS: ${{ contains(github.event.head_commit.message, '[skip tests]') }}

jobs:
  linux-build:
    name: Build ${{ matrix.pretty }}
    if: (!inputs.jobs || contains(inputs.jobs, 'linux-build'))
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.container_image }}
      options: ${{ matrix.container_options }}
    strategy:
      fail-fast: false
      matrix:
        platform: [centos-9-x64, ubuntu-2404-x64, ubuntu-2404-arm64]
        include:
          - platform: centos-9-x64
            pretty: CentOS 9 (AlmaLinux) x64
            os: ubuntu-24.04
            container_image: nrel/openstudio-cmake-tools:almalinux9-main
            container_options: "--privileged -u root"
            test_suffix: CentOS-9
            docker_trigger: false
            upload_globs: |
              *.rpm
              *OpenStudio*x86_64.tar.gz
            exclude_regex: "BCLFixture.RemoteBCLMetaSearchTest"
          - platform: ubuntu-2404-x64
            pretty: Ubuntu 24.04 x64
            os: ubuntu-24.04
            container_image: nrel/openstudio-cmake-tools:noble-main
            container_options: "--privileged -u root"
            test_suffix: Ubuntu-2404
            docker_trigger: true
            upload_globs: |
              *.deb
              *OpenStudio*x86_64.tar.gz
            exclude_regex: ""
          - platform: ubuntu-2404-arm64
            pretty: Ubuntu 24.04 ARM64
            os: ubuntu-24.04-arm
            container_image: nrel/openstudio-cmake-tools:noble-main
            container_options: "--privileged -u root"
            test_suffix: Ubuntu-2404-ARM64
            docker_trigger: false
            upload_globs: |
              *.deb
              *OpenStudio*arm64.tar.gz
            # SqlFileFixture.AnnualTotalCosts needed until E+ itself disables ffp-contract on arm64 GCC
            exclude_regex: "SqlFileFixture.AnnualTotalCosts|OpenStudioCLI.*test_measure_manager"
    defaults:
      run:
        shell: bash
    env:
      # $HOME in GHA containers. Explicit so the tools and actions/cache agree on the paths (#5711)
      CCACHE_DIR: /github/home/.ccache
      CONAN_HOME: /github/home/.conan2

    permissions:
      # Needed permission to upload the release asset
      contents: write

    steps:
      - name: Enable Swap and Verify space
        run: |
          echo "Enabling Swap..."
          # Create and enable 8GB swap file to prevent OOM kills
          # RUNNER_TEMP is bind-mounted from the host disk: swapon doesn't work on the container's overlayfs
          SWAPFILE="$RUNNER_TEMP/swapfile_extra"
          dd if=/dev/zero of="$SWAPFILE" bs=1M count=8192 status=progress
          chmod 600 "$SWAPFILE"
          mkswap "$SWAPFILE"
          swapon "$SWAPFILE"

          echo
          echo "Memory and swap:"
          # Check if free exists before running it, or ignore failure
          if command -v free >/dev/null 2>&1; then
            free -h
          else
            echo "free command not available"
          fi
          echo
          swapon --show || true
          echo
          echo "Available storage:"
          df -h || true
          echo

      - &checkout
        name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - &get_base_sha
        name: Get base branch SHA
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          # github.event.pull_request.base.sha is the base at PR creation, not the current tip
          BASE_SHA=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/${{ github.base_ref }}" | cut -f1)
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - &restore_ccache
        name: Restore ccache cache
        id: ccache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.os }}-${{ matrix.platform }}-pch=${{ env.ENABLE_PCH }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ matrix.platform }}-pch=${{ env.ENABLE_PCH }}-${{ env.BASE_SHA }}
            ccache-${{ matrix.os }}-${{ matrix.platform }}-pch=${{ env.ENABLE_PCH }}-

      - name: Prepare workspace
        run: |

          git config --global --add safe.directory '*'

          mkdir -p "$CCACHE_DIR" "$CONAN_HOME"

      - name: Fix CMake Path (CentOS)
        if: matrix.platform == 'centos-9-x64'
        run: |
          if [ -d /usr/local/cmake/bin ]; then
            echo "Adding /usr/local/cmake/bin to PATH"
            echo "/usr/local/cmake/bin" >> $GITHUB_PATH
          fi

      - &install_python_deps
        name: Install Python dependencies
        shell: bash
        run: python -m pip install -r python/requirements.txt

      - name: Setup Conan
        uses: ./.github/actions/setup-conan
        with:
          cache-key-prefix: conan-${{ matrix.os }}-${{ matrix.platform }}
          build-folder: ${{ env.OPENSTUDIO_BUILD }}
          build-type: ${{ env.BUILD_TYPE }}
          build-policy: ${{ contains(inputs.conan_build_all, matrix.platform) && '*' || 'missing' }}
          # nrel-v2's gcc 14 binaries are built on ubuntu-24.04 with GLIBC 2.39 (AlmaLinux 9 has 2.34). Making the libc version part of the
          # package_id means they never match, so we build from source (or pull the glibc 2.34 ones once uploaded to nrel-v2).
          # See https://github.com/NatLabRockies/openstudio-cmake-tools/issues/6
          config-install: ${{ matrix.platform == 'centos-9-x64' && 'developer/conan/config' || '' }}
          extra-args: ${{ matrix.platform == 'centos-9-x64' && '-pr:a glibc' || '' }}

      - name: Configure with CMake
        run: |
          # Build type, testing, bindings, Python version/root and CPack generators all come from the conanfile.py preset
          cmake --preset conan-release \
            -DENABLE_PCH:BOOL=${{ env.ENABLE_PCH }} \
            -DCMAKE_JOB_POOL_LINK:STRING=console

      - &show_restored_ccache_stats
        name: Show restored ccache stats
        shell: bash
        run: |
          # Stats live in the cache dir, so they come back with the restore: show them, then zero them for this run
          ccache --show-stats -vv
          ccache --zero-stats
          ccache --show-config

      - &build_with_ninja
        name: Build with Ninja
        shell: bash
        run: |
          # Run from the source dir, where CMakeUserPresets.json is. The preset carries the Conan build environment (SWIG_LIB, ...)
          cmake --build --preset conan-release 2>&1 | tee ${{ env.OPENSTUDIO_BUILD }}/build.log
          build_exit=${PIPESTATUS[0]}
          ninja -C ${{ env.OPENSTUDIO_BUILD }} -d stats || true
          exit $build_exit

      - &show_ccache_stats
        name: Show ccache stats
        if: always()
        shell: bash
        run: ccache --show-stats -vv

      - &save_ccache
        name: Save ccache cache
        # Still save when the build fails, but not when the run is cancelled: that would save a partial cache, which is then the newest one the restore-keys pick
        if: ${{ !cancelled() && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - &upload_build_diagnostics
        name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-diag-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ env.OPENSTUDIO_BUILD }}/build.log
            ${{ env.OPENSTUDIO_BUILD }}/.ninja_log
            ${{ env.OPENSTUDIO_BUILD }}/CTestTestfile.cmake
          if-no-files-found: warn
          # .ninja_log is a hidden file, skipped by default
          include-hidden-files: true

      - &run_ctest
        name: Run CTest suite
        if: env.SKIP_TESTS != 'true'
        id: ctest
        continue-on-error: true
        working-directory: ${{ env.OPENSTUDIO_BUILD }}
        shell: bash
        run: |
          overall_exit_code=0

          begin_group() { echo -e "::group::\033[93m$1\033[0m"; }

          export CTEST_OUTPUT_ON_FAILURE=1
          exclude_pattern="${{ matrix.exclude_regex }}"

          ctest_command=(ctest -C ${{ env.BUILD_TYPE }})
          if [ -n "$exclude_pattern" ]; then
            ctest_command+=(-E "^($exclude_pattern)$")
          fi

          jobs=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)

          begin_group "Running tests..."
          echo "Running: ${ctest_command[@]} -j $jobs --output-junit Testing/Results.xml"
          "${ctest_command[@]}" -j $jobs --output-junit Testing/Results.xml || overall_exit_code=$?
          echo "::endgroup::"

          if [ $overall_exit_code -ne 0 ]; then
            first_failed=$(cut -d: -f2 Testing/Temporary/LastTestsFailed.log | tr '\n' ' ')

            begin_group "Rerunning failing tests..."
            echo "Running: ${ctest_command[@]} --rerun-failed --output-on-failure --output-junit Testing/Rerun.xml"
            "${ctest_command[@]}" --rerun-failed --output-on-failure --output-junit Testing/Rerun.xml && overall_exit_code=0 || overall_exit_code=$?
            echo "::endgroup::"

            if [ $overall_exit_code -eq 0 ]; then
              echo "::warning title=Flaky tests::Failed, then passed on rerun (probably not safe to run in parallel): $first_failed"
            fi
          fi

          echo "exit_code=${overall_exit_code}" >> $GITHUB_OUTPUT

      - &copy_testing_tree
        name: Copy Testing tree with suffix
        if: always() && env.SKIP_TESTS != 'true'
        working-directory: ${{ env.OPENSTUDIO_BUILD }}
        shell: bash
        run: |
          if [ -d "Testing" ]; then
            cp -r Testing "Testing-${{ matrix.test_suffix }}"
          fi

      - &generate_test_summary
        name: Generate test summary
        if: always() && env.SKIP_TESTS != 'true'
        working-directory: ${{ env.OPENSTUDIO_BUILD }}
        shell: bash
        run: |

          # Generate a simple markdown summary from CTest results
          mkdir -p "$(dirname '${{ env.TEST_DASHBOARD_RELATIVE }}')"

          echo "# OpenStudio Test Results - ${{ matrix.test_suffix }}" > "${{ env.TEST_DASHBOARD_RELATIVE }}"
          echo "" >> "${{ env.TEST_DASHBOARD_RELATIVE }}"
          echo "**Build:** \`${{ github.sha }}\`" >> "${{ env.TEST_DASHBOARD_RELATIVE }}"
          echo "**Branch:** \`${{ github.ref_name }}\`" >> "${{ env.TEST_DASHBOARD_RELATIVE }}"
          echo "**Platform:** ${{ matrix.pretty }}" >> "${{ env.TEST_DASHBOARD_RELATIVE }}"
          echo "**Date:** $(date -u)" >> "${{ env.TEST_DASHBOARD_RELATIVE }}"
          echo "" >> "${{ env.TEST_DASHBOARD_RELATIVE }}"

          if [ -f Testing/Temporary/LastTest.log ]; then
            echo "## Test Log (Last 50 lines)" >> "${{ env.TEST_DASHBOARD_RELATIVE }}"
            echo '```' >> "${{ env.TEST_DASHBOARD_RELATIVE }}"
            tail -50 Testing/Temporary/LastTest.log >> "${{ env.TEST_DASHBOARD_RELATIVE }}"
            echo '```' >> "${{ env.TEST_DASHBOARD_RELATIVE }}"
          fi
        continue-on-error: true

      - &upload_testing_artifact
        name: Upload Testing artifact
        if: always() && env.SKIP_TESTS != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Testing-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ env.OPENSTUDIO_BUILD }}/Testing-${{ matrix.test_suffix }}/
            ${{ env.OPENSTUDIO_BUILD }}/${{ env.TEST_DASHBOARD_RELATIVE }}

      - name: Create packages
        if: ${{ success() && !cancelled() }}
        working-directory: ${{ env.OPENSTUDIO_BUILD }}
        run: |
          . ./conanbuild.sh
          cpack -C ${{ env.BUILD_TYPE }}

      - name: Upload DEB installer
        # The generators come from the conanfile.py CMakePresets: DEB on Ubuntu, RPM on Red Hat-like
        if: startsWith(matrix.platform, 'ubuntu')
        uses: actions/upload-artifact@v7
        with:
          name: OS-Installers-${{ matrix.platform }}-DEB-${{ github.sha }}
          path: ${{ env.OPENSTUDIO_BUILD }}/*.deb
          if-no-files-found: error

      - name: Upload RPM installer
        if: startsWith(matrix.platform, 'centos')
        uses: actions/upload-artifact@v7
        with:
          name: OS-Installers-${{ matrix.platform }}-RPM-${{ github.sha }}
          path: ${{ env.OPENSTUDIO_BUILD }}/*.rpm
          if-no-files-found: error

      - name: Upload TGZ installer
        uses: actions/upload-artifact@v7
        with:
          name: OS-Installers-${{ matrix.platform }}-TGZ-${{ github.sha }}
          path: ${{ env.OPENSTUDIO_BUILD }}/OpenStudio-*.tar.gz
          if-no-files-found: ignore

      - &fail_on_test_failures
        name: Fail job on test failures
        if: env.SKIP_TESTS != 'true' && steps.ctest.outputs.exit_code != '0'
        working-directory: ${{ env.OPENSTUDIO_BUILD }}
        shell: bash
        run: |
          cat "${{ env.TEST_DASHBOARD_RELATIVE }}" || true
          if [ -f Testing/Temporary/LastTestsFailed.log ]; then
            echo; echo "Failed tests:"; cat Testing/Temporary/LastTestsFailed.log
          fi
          echo "::error::CTest suite failed with exit code ${{ steps.ctest.outputs.exit_code }}"
          exit 1

  macos-build:
    name: Build Packages for ${{ matrix.pretty }}
    if: (!inputs.jobs || contains(inputs.jobs, 'macos-build'))
    # Apple signing secrets live in the apple-signing environment, which only these refs may use.
    # Other refs (PRs, feature branches) get no environment and fall back to ad-hoc signing.
    environment: ${{ github.repository == 'NatLabRockies/OpenStudio' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && 'apple-signing' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 720
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-x64, macos-arm64]
        include:
          - macos_dev_target: "12.1"
            platform: macos-x64
            pretty: "macOS x64"
            os: macos-15-intel
            allow_failure: false
            test_suffix: macOS-x64
            arch: x86_64
            python-arch: x64
            dmg_glob: "*.dmg"
            tar_glob: "*OpenStudio*x86_64.tar.gz"
            exclude_regex: ""
          - macos_dev_target: "13.0"
            platform: macos-arm64
            pretty: "macOS ARM64"
            os: macos-15
            allow_failure: false
            test_suffix: macOS-arm64
            arch: arm64
            python-arch: arm64
            dmg_glob: "*.dmg"
            tar_glob: "*OpenStudio*arm64.tar.gz"
            exclude_regex: ""
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    permissions:
      # Needed permission to upload the release asset
      contents: write

    steps:
    - *checkout

    - name: Verify space
      shell: bash
      run: |
        echo "Memory and swap:"
        if command -v vm_stat >/dev/null 2>&1; then
          vm_stat
        fi
        echo
        sysctl vm.swapusage || true
        echo
        echo "Available storage:"
        df -h . || true
        echo

    - name: Git safe directory
      run: git config --global --add safe.directory '*'

    - name: Install System dependencies
      shell: bash
      run: |
        # The MACOSX_DEPLOYMENT_TARGET environment variable sets the default value for the CMAKE_OSX_DEPLOYMENT_TARGET variable.
        # We use cmake commands to build some subprojects, so setting it globally
        echo MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_dev_target }} >> $GITHUB_ENV
        brew install ninja ccache

    - *get_base_sha

    - *restore_ccache

    - name: Set up Python ${{ env.PYTHON_REQUIRED_VERSION }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_REQUIRED_VERSION }}

    - *install_python_deps

    - name: Install Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2.2'

    - name: Set up Qt IFW
      run: |
        cd $RUNNER_TEMP
        mkdir QtIFW && cd QtIFW
        aria2c https://github.com/jmarrec/QtIFW-fixup/releases/download/v5.0.0-dev-with-fixup/QtIFW-5.0.0-${{ matrix.arch }}.zip
        xattr -r -d com.apple.quarantine ./QtIFW-5.0.0-${{ matrix.arch }}.zip
        unzip QtIFW-5.0.0-${{ matrix.arch }}.zip
        rm -Rf ./*.zip
        chmod +x *
        ./installerbase --version
        echo "$(pwd)" >> $GITHUB_PATH

    - name: Create Build Directory
      run: cmake -E make_directory ${{ env.OPENSTUDIO_BUILD }}

    - name: Setup Conan
      uses: ./.github/actions/setup-conan
      with:
        cache-key-prefix: conan-${{ matrix.os }}-${{ matrix.platform }}
        build-folder: ${{ env.OPENSTUDIO_BUILD }}
        build-type: ${{ env.BUILD_TYPE }}
        build-policy: ${{ contains(inputs.conan_build_all, matrix.platform) && '*' || 'missing' }}
        # Same as jmarrec/conan-recipes upload_deps.yml, for the deps that have to be built from source (boost with recent clang)
        extra-args: -c tools.build:cxxflags="['-D_LIBCPP_ENABLE_CXX17_REMOVED_UNARY_BINARY_FUNCTION', '-Wno-enum-constexpr-conversion']"

    - name: Configure with CMake
      run: |
        # Build type, testing, bindings, Python version/root and CPack generators all come from the conanfile.py preset,
        # the libc++ CXX flags from the tools.build:cxxflags conf (see Setup Conan), the deployment target from MACOSX_DEPLOYMENT_TARGET.
        # ruby/test/CMakeLists.txt only looks in hardcoded locations (NO_DEFAULT_PATH, to avoid the conan ruby), not in setup-ruby's toolcache
        cmake --preset conan-release \
          -DSYSTEM_RUBY_EXECUTABLE:FILEPATH="$(command -v ruby)" \
          -DENABLE_PCH:BOOL=${{ env.ENABLE_PCH }} \
          -DCMAKE_JOB_POOL_LINK:STRING=console

    - *show_restored_ccache_stats

    - *build_with_ninja

    - *show_ccache_stats

    - *save_ccache

    - *upload_build_diagnostics

    - name: Install bundler
      if: env.SKIP_TESTS != 'true'
      shell: bash
      run: gem install bundler -v 2.4.10 --conservative --no-document

    - *run_ctest

    - name: Setup Keychain
      # Same refs as the job's environment: the Apple secrets are apple-signing environment secrets, which can only deploy to develop/master/v* tags.
      # So a publish_to_s3 dispatch from another branch publishes an unsigned DMG instead of failing here.
      if: success() && github.repository == 'NatLabRockies/OpenStudio' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
      env:
        APPLE_CERT_DATA: ${{ secrets.APPLE_CERT_DATA }}
        APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        APPLE_DEV_ID: ${{ secrets.APPLE_DEV_ID }}
      run: |
        if [ -n "$APPLE_CERT_DATA" ] && [ -n "$APPLE_CERT_PASSWORD" ] && [ -n "$APPLE_DEV_ID" ]; then
          # Create temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERT_DATA" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          # Developer ID G2 intermediate: without it the identity is untrusted and codesign can't build the chain
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          # codesign/binarycreator only find identities in keychains on the search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$APPLE_DEV_ID" || {
            echo "::error::Identity '$APPLE_DEV_ID' not found in imported certificate (APPLE_DEV_ID must be the full 'Developer ID Application: Name (TEAMID)' string)"
            exit 1
          }

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
        else
          echo "::warning::Apple signing secrets not set; packages will be ad-hoc signed and not notarized."
        fi

    - name: Create packages
      id: create_packages
      if: ${{ success() && !cancelled() }}
      working-directory: ${{ env.OPENSTUDIO_BUILD }}
      env:
        COPYFILE_DISABLE: 1
        APPLE_DEV_ID: ${{ secrets.APPLE_DEV_ID }}
      run: |
        . ./conanbuild.sh
        SIGNING_ARGS=()
        if [ -n "$KEYCHAIN_PATH" ]; then
          # cpack re-detects the QtIFW version with a 1 s timeout unless these three are set; on a slow runner
          # detection fails, the version reads as < 3.0 and binarycreator runs without --sign (notarization: "not signed").
          # Keep the version in sync with the QtIFW zip in "Set up Qt IFW".
          binarycreator=$(command -v binarycreator)
          repogen=$(command -v repogen)
          SIGNING_ARGS=(-D "CPACK_IFW_PACKAGE_SIGNING_IDENTITY=$APPLE_DEV_ID"
            -D "CPACK_IFW_FRAMEWORK_VERSION=5.0.0"
            -D "CPACK_IFW_BINARYCREATOR_EXECUTABLE=$binarycreator"
            -D "CPACK_IFW_REPOGEN_EXECUTABLE=$repogen")
        fi
        cpack -C ${{ env.BUILD_TYPE }} "${SIGNING_ARGS[@]}"

    - name: Ad-hoc Sign Inner Installer (Fix "Killed" Error)
      if: ${{ success() && !cancelled() }}
      working-directory: ${{ env.OPENSTUDIO_BUILD }}
      run: |

        # Only needed when cpack did not sign with a Developer ID (no keychain set up).
        if [ -n "$KEYCHAIN_PATH" ]; then
          echo "Developer ID keychain present. Skipping ad-hoc patch."
          exit 0
        fi

        echo "No Developer ID found. Patching DMGs with ad-hoc signature..."

        # Loop through all generated DMGs
        find . -maxdepth 1 -name "*.dmg" -print0 | while IFS= read -r -d '' dmg_file; do
          ../developer/scripts/patch_adhoc_dmg.sh "$dmg_file"
        done

    - name: Sign DMG and Notarize
      if: ${{ !cancelled() && steps.create_packages.outcome == 'success' }}
      working-directory: ${{ env.OPENSTUDIO_BUILD }}
      env:
        APPLE_DEV_ID: ${{ secrets.APPLE_DEV_ID }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      run: |
        set -euo pipefail
        NOTARIZE=false
        if [ -n "${KEYCHAIN_PATH:-}" ]; then
          if [ -n "$APPLE_ID_USERNAME" ] && [ -n "$APPLE_ID_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            NOTARIZE=true
          else
            echo "::warning::APPLE_ID_USERNAME/APPLE_ID_PASSWORD/APPLE_TEAM_ID not set; DMGs will be signed but not notarized."
          fi
        fi
        NOTARY_AUTH=(--apple-id "$APPLE_ID_USERNAME" --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID")

        mkdir -p signed
        for dmg in ${{ matrix.dmg_glob }}; do
          [ -f "$dmg" ] || continue
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            echo "Signing $dmg with Developer ID..."
            codesign --force --sign "$APPLE_DEV_ID" --keychain "$KEYCHAIN_PATH" --timestamp "$dmg"
          else
            echo "Applying ad-hoc signature to $dmg"
            codesign --force --sign - "$dmg"
          fi

          if [ "$NOTARIZE" = true ]; then
            echo "Notarizing $dmg..."
            result=$(xcrun notarytool submit "$dmg" "${NOTARY_AUTH[@]}" --wait --output-format json)
            echo "$result"
            sub_id=$(echo "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
            status=$(echo "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            # notarytool can exit 0 with status Invalid; check status and print Apple's per-file findings
            if [ "$status" != "Accepted" ]; then
              xcrun notarytool log "$sub_id" "${NOTARY_AUTH[@]}" || true
              echo "::error::Notarization of $dmg returned '$status'"
              exit 1
            fi
            # Stapling fetches the ticket from Apple's CloudKit, which can drop the connection or lag just after acceptance
            for i in 1 2 3 4 5; do
              xcrun stapler staple "$dmg" && break
              if [ "$i" -eq 5 ]; then
                echo "::error::Stapling $dmg failed 5 times"
                exit 1
              fi
              echo "::warning::Stapling attempt $i failed, retrying in 30s"
              sleep 30
            done
            spctl -a -t open --context context:primary-signature -v "$dmg"
          fi

          cp "$dmg" "signed/$(basename "$dmg")"
        done
        echo "Code signing completed"

    - name: Delete signing keychain
      if: always()
      run: |
        if [ -n "${KEYCHAIN_PATH:-}" ]; then
          security delete-keychain "$KEYCHAIN_PATH" || true
        fi

    - *copy_testing_tree

    - *generate_test_summary

    - *upload_testing_artifact

    - name: Determine installer path
      id: installer_path
      if: ${{ !cancelled() }}
      run: |
        if ls ${{ env.OPENSTUDIO_BUILD }}/signed/*.dmg 1> /dev/null 2>&1; then
          echo "path=${{ env.OPENSTUDIO_BUILD }}/signed/*.dmg" >> $GITHUB_OUTPUT
        elif ls ${{ env.OPENSTUDIO_BUILD }}/*.dmg 1> /dev/null 2>&1; then
          echo "path=${{ env.OPENSTUDIO_BUILD }}/*.dmg" >> $GITHUB_OUTPUT
        else
            echo "path=${{ env.OPENSTUDIO_BUILD }}/*.zip" >> $GITHUB_OUTPUT
        fi

    - name: Upload IFW installer
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: OS-Installers-${{ matrix.platform }}-IFW-${{ github.sha }}
        path: ${{ steps.installer_path.outputs.path }}
        if-no-files-found: ignore

    - name: Upload TGZ package
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: OS-Installers-${{ matrix.platform }}-TGZ-${{ github.sha }}
        path: ${{ env.OPENSTUDIO_BUILD }}/OpenStudio-*.tar.gz
        if-no-files-found: ignore

    - *fail_on_test_failures

  windows-build:
    name: Build ${{ matrix.pretty }}
    if: (!inputs.jobs || contains(inputs.jobs, 'windows-build'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-2022-x64]
        include:
          - platform: windows-2022-x64
            pretty: Windows 2022 x64
            os: windows-2022
            test_suffix: Windows-2022
            vs-generator: x64
            arch: x86_64
            python-arch: x64
            allow_failure: false
            exclude_regex: ""
    defaults:
      run:
        shell: pwsh
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      RUBYOPT: "-Eutf-8:utf-8"
      PYTHONUTF8: "1"
    permissions:
      contents: write

    steps:
      - *checkout

      - name: Verify space
        run: |
          # Workspace, build and ccache are on D:, the Conan home on C:
          Get-PSDrive C, D | Select-Object Name, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
          Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize,FreePhysicalMemory,TotalVirtualMemorySize,FreeVirtualMemory

      - name: Git safe directory
        run: git config --global --add safe.directory '*'

      - name: Test signing scripts
        run: |
          ./.github/signing-client/Test-SigningWithRetry.ps1
          if ($LASTEXITCODE) { exit 1 }
          ./.github/signing-client/Test-AssertAuthenticodeSigned.ps1

      - name: Install ccache
        # Not sccache: it refuses to cache MSVC compiles using PCH (/Yc, /Fp), i.e. ~95% of them
        run: choco install ccache -y --no-progress

      - *get_base_sha

      - *restore_ccache

      - name: Prepare workspace
        run: |
          New-Item -ItemType Directory -Path "${{ env.OPENSTUDIO_BUILD }}" -Force

      - name: Set up Python 3.12.2
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.2'
          cache: 'pip'

      - *install_python_deps

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'

      - name: Setup QtIFW 4.x
        uses: jmarrec/setup-qtifw@v1
        with:
          qtifw-version: '4.8.1'

      - name: Create Build Directory
        run: cmake -E make_directory ${{ env.OPENSTUDIO_BUILD }}

      - name: Setup Conan
        uses: ./.github/actions/setup-conan
        with:
          cache-key-prefix: conan-${{ matrix.os }}-${{ matrix.platform }}
          build-folder: ${{ env.OPENSTUDIO_BUILD }}
          build-type: ${{ env.BUILD_TYPE }}
          build-policy: ${{ contains(inputs.conan_build_all, matrix.platform) && '*' || 'missing' }}

      - name: Configure with CMake
        # From the source dir: that's where conan put the CMakeUserPresets.json. Toolchain, Ninja, build type, testing, bindings, Python version/root and CPack generators all come from the conanfile.py preset
        run: |
          # ruby/test/CMakeLists.txt only looks in hardcoded locations (NO_DEFAULT_PATH, to avoid the conan ruby), not in setup-ruby's toolcache
          $rubyExe = (Get-Command ruby).Source
          # $env:ComSpec, not cmd: setup-ruby puts its MSYS2 usr/bin, which has a 'cmd' script, ahead in the PATH (that's also why we can't use conan's conanbuild.ps1)
          & $env:ComSpec /c "call ${{ env.OPENSTUDIO_BUILD }}\conanbuild.bat && cmake --preset conan-release -DSYSTEM_RUBY_EXECUTABLE:FILEPATH=`"$rubyExe`" -DENABLE_PCH:BOOL=${{ env.ENABLE_PCH }} -DCMAKE_JOB_POOL_LINK:STRING=console"

      - *show_restored_ccache_stats

      - name: Build with Ninja
        run: |
          # $env:ComSpec, not cmd: see Configure with CMake
          & $env:ComSpec /c "call ${{ env.OPENSTUDIO_BUILD }}\conanbuild.bat && cmake --build --preset conan-release -- -d stats 2>&1" | Tee-Object -FilePath "${{ env.OPENSTUDIO_BUILD }}\build.log"
          # The exit code of the cmd process, not Tee-Object's
          exit $LASTEXITCODE

      - *show_ccache_stats

      - *save_ccache

      - *upload_build_diagnostics

      - *run_ctest

      - *copy_testing_tree

      - *generate_test_summary

      - *upload_testing_artifact

      # CODE SIGNING SETUP
      - name: Setup Node.js
        if: github.repository == 'NatLabRockies/OpenStudio' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_s3 == true || github.event.inputs.publish_to_s3 == 'true')
        uses: actions/setup-node@v7
        with:
          node-version: "18"

      - name: Create .env file for Signing
        if: github.repository == 'NatLabRockies/OpenStudio' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_s3 == true || github.event.inputs.publish_to_s3 == 'true')
        working-directory: ${{ env.OPENSTUDIO_BUILD }}
        run: |
          echo "ACCESS_KEY=${{ secrets.AWS_SIGNING_ACCESS_KEY }}" >> .env
          echo "SECRET_KEY=${{ secrets.AWS_SIGNING_SECRET_KEY }}" >> .env

      - name: Code sign binaries
        if: success() && github.repository == 'NatLabRockies/OpenStudio' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_s3 == true || github.event.inputs.publish_to_s3 == 'true')
        # Caps a hung signing service; Invoke-SigningWithRetry.ps1 sizes its 3 attempts to fit inside this
        timeout-minutes: 60
        working-directory: ${{ env.OPENSTUDIO_BUILD }}
        run: |
          # This step only runs on refs that publish, so a missing client or secret must fail rather than ship unsigned
          $signingDir = "../.github/signing-client"
          if (-not (Test-Path "$signingDir/code-signing.js")) {
            Write-Host "::error::Code signing client not found at .github/signing-client/code-signing.js"
            exit 1
          }
          if ([string]::IsNullOrEmpty("${{ secrets.AWS_SIGNING_ACCESS_KEY }}")) {
            Write-Host "::error::AWS_SIGNING_ACCESS_KEY secret not configured"
            exit 1
          }

          Write-Host "------------------------------------------------------------"
          Write-Host "Signing Binaries (Pre-CPack)"
          Write-Host "------------------------------------------------------------"

          $pathsToSign = @()
          if (Test-Path "bin") { $pathsToSign += "bin" }
          if (Test-Path "Products") { $pathsToSign += "Products" }
          if ($pathsToSign.Count -eq 0) {
            Write-Host "::error::No bin/ or Products/ directories found to sign."
            exit 1
          }

          $binZip = "binaries_to_sign.zip"
          $signedBinZip = "binaries_to_sign.signed.zip"

          Write-Host "Archiving binaries from: $pathsToSign"
          Compress-Archive -Path $pathsToSign -DestinationPath $binZip -Force

          Write-Host "Sending binaries for signing..."
          & "$signingDir/Invoke-SigningWithRetry.ps1" $binZip
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Signing binaries failed on every attempt!"
            exit 1
          }

          Write-Host "Extracting and overwriting signed binaries..."
          $tempDir = "temp_signed_binaries"
          if (Test-Path $tempDir) { Remove-Item $tempDir -Recurse -Force }
          Expand-Archive -Path $signedBinZip -DestinationPath $tempDir -Force

          # Only top-level exe/dll files: these are what OpenStudio builds; nested files may be third-party
          $toVerify = Get-ChildItem -Path ($pathsToSign | ForEach-Object { "$tempDir\$_\*" }) -Include *.exe, *.dll -File
          & "$signingDir/Assert-AuthenticodeSigned.ps1" -Path @($toVerify | ForEach-Object FullName)
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Copy-Item -Path "$tempDir\*" -Destination . -Recurse -Force

          Remove-Item $tempDir -Recurse -Force
          Remove-Item $binZip -Force
          Remove-Item $signedBinZip -Force
          Write-Host "Binaries signed successfully."

      - name: Create packages
        if: ${{ success() && !cancelled() }}
        working-directory: ${{ env.OPENSTUDIO_BUILD }}
        run: |
          & $env:ComSpec /c "call conanbuild.bat && cpack -C ${{ env.BUILD_TYPE }}"

      - name: Code sign installer
        if: success() && github.repository == 'NatLabRockies/OpenStudio' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_s3 == true || github.event.inputs.publish_to_s3 == 'true')
        # Caps a hung signing service; Invoke-SigningWithRetry.ps1 sizes its 3 attempts to fit inside this
        timeout-minutes: 60
        working-directory: ${{ env.OPENSTUDIO_BUILD }}
        run: |
          # The binaries step already failed if the client or secret is missing
          $signingDir = "../.github/signing-client"

          Write-Host "------------------------------------------------------------"
          Write-Host "Signing Final Installer"
          Write-Host "------------------------------------------------------------"

          $installerZip = "installer_to_sign_${{ github.sha }}.zip"
          $signedInstallerZip = "installer_to_sign_${{ github.sha }}.signed.zip"

          $installers = @(Get-ChildItem -Filter "OpenStudio-*.exe")
          if ($installers.Count -ne 1) {
            Write-Host "::error::Expected one OpenStudio installer to sign, found $($installers.Count): $($installers.Name)"
            exit 1
          }
          $installer = $installers[0]
          Write-Host "Found installer: $($installer.Name)"

          Compress-Archive -Path $installer.FullName -DestinationPath $installerZip -Force

          Write-Host "Sending installer for signing..."
          & "$signingDir/Invoke-SigningWithRetry.ps1" $installerZip
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Signing installer failed on every attempt!"
            exit 1
          }

          Write-Host "Extracting signed installer..."
          if (-not (Test-Path signed)) { New-Item -ItemType Directory -Path signed | Out-Null }
          Expand-Archive -Path $signedInstallerZip -DestinationPath signed -Force

          $extractedFiles = @(Get-ChildItem -Path signed -Filter "*.exe")
          if ($extractedFiles.Count -ne 1) {
            Write-Host "::error::Expected one EXE in the signed archive, found $($extractedFiles.Count)"
            exit 1
          }
          $extractedFile = $extractedFiles[0]
          if ($extractedFile.Name -ne $installer.Name) {
            # Rename to match the original filename to prevent distributing a misnamed file
            Write-Host "::warning::Signed file name mismatch: expected $($installer.Name), got $($extractedFile.Name); renaming"
            $extractedFile = Rename-Item -Path $extractedFile.FullName -NewName $installer.Name -Force -PassThru
          }

          & "$signingDir/Assert-AuthenticodeSigned.ps1" -Path $extractedFile.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Remove-Item $installerZip -Force
          Remove-Item $signedInstallerZip -Force
          Write-Host "Installer signed successfully."

      - name: Upload Signed EXE installer
        uses: actions/upload-artifact@v7
        with:
          name: OS-Installers-${{ matrix.platform }}-EXE-${{ github.sha }}
          path: ${{ env.OPENSTUDIO_BUILD }}/signed/OpenStudio*.exe
          if-no-files-found: ignore

      # PRs skip signing, so ship the unsigned cpack EXE for testers; the name avoids windows-publish's download pattern
      - name: Upload unsigned EXE installer
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: OS-Unsigned-EXE-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ env.OPENSTUDIO_BUILD }}/OpenStudio-*.exe
          if-no-files-found: warn

      - name: Upload Signed TGZ installer
        uses: actions/upload-artifact@v7
        with:
          name: OS-Installers-${{ matrix.platform }}-TGZ-${{ github.sha }}
          path: ${{ env.OPENSTUDIO_BUILD }}/_CPack_Packages/win64/TGZ/*.tar.gz
          if-no-files-found: ignore

      - *fail_on_test_failures

  linux-publish:
    name: Publish Linux Artifacts
    needs: [linux-build]
    runs-on: ubuntu-latest
    if: &publish_if github.repository == 'NatLabRockies/OpenStudio' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_s3 == true || github.event.inputs.publish_to_s3 == 'true')
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v8
        with:
          pattern: OS-Installers-{ubuntu,centos}-*
          merge-multiple: true
          path: installers

      - &configure_aws_credentials
        name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-west-2' }}

      - name: Publish to S3
        working-directory: installers
        env:
          S3_PREFIX: ${{ github.ref_type == 'tag' && format('releases/{0}', github.ref_name) || format('{0}', github.ref_name) }}
        run: &s3_upload |
          echo "Uploading artifacts to s3://${AWS_S3_BUCKET}/${S3_PREFIX}"
          for file in *; do
            [ -e "$file" ] || continue
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            key="${S3_PREFIX}/${filename}"
            aws s3 cp "$file" "s3://${AWS_S3_BUCKET}/${key}" --acl public-read
            if command -v md5sum >/dev/null 2>&1; then md5sum "$file"; else md5 "$file"; fi
          done

      - name: Trigger Docker Build
        if: inputs.skip_docker_trigger != true && github.event.inputs.skip_docker_trigger != 'true'
        working-directory: installers
        env:
          GH_TOKEN: ${{ secrets.DOCKER_OPENSTUDIO_PAT }}
          BRANCH_NAME: ${{ github.ref_name }}
          S3_PREFIX: ${{ github.ref_type == 'tag' && format('releases/{0}', github.ref_name) || format('{0}', github.ref_name) }}
        run: |

          # Find the 24.04 deb file locally
          DEB_FILE=$(find . -name "*24.04*.deb" | head -n 1)
          if [ -z "$DEB_FILE" ]; then
            echo "::error::Could not find Ubuntu 24.04 deb file in installers directory"
            ls -la
            exit 1
          fi

          FILENAME=$(basename "$DEB_FILE")
          echo "Found file: $FILENAME"

          # Construct S3 URL
          # Replace + with %2B
          ENCODED_FILENAME=${FILENAME//+/%2B}
          BINARY_URL="https://${AWS_S3_BUCKET}.s3.amazonaws.com/${S3_PREFIX}/${ENCODED_FILENAME}"
          echo "Binary URL: $BINARY_URL"

          # Parse version from filename
          # Expected format: OpenStudio-<Version>-<Platform>.deb
          if [[ "$FILENAME" =~ OpenStudio-(.+)-Ubuntu-24\.04.*\.deb ]]; then
             OS_VERSION_FULL=${BASH_REMATCH[1]}
          elif [[ "$FILENAME" =~ OpenStudio-(.+)-Linux.*\.deb ]]; then
             OS_VERSION_FULL=${BASH_REMATCH[1]}
          else
             echo "::error::Could not parse version from filename: $FILENAME"
             exit 1
          fi

          echo "Full Version: $OS_VERSION_FULL"

          # Logic from Jenkins:
          # Split by +
          IFS='+' read -r VER_PART SHA_PART <<< "$OS_VERSION_FULL"

          if [[ "$VER_PART" == *"-"* ]]; then
             # 3.3.0-rc1 -> Ver: 3.3.0, Ext: rc1
             IFS='-' read -r OS_VERSION OS_VERSION_EXT <<< "$VER_PART"
          else
             # 3.3.0+sha -> Ver: 3.3.0, Ext: sha
             OS_VERSION="$VER_PART"
             OS_VERSION_EXT="$SHA_PART"
          fi

          echo "OS Version: $OS_VERSION"
          echo "OS Version Ext: $OS_VERSION_EXT"

          # Docker Tag Logic
          if [[ "$BRANCH_NAME" == "develop" ]]; then
             DOCKER_IMAGE_TAG="develop"
          else
             DOCKER_IMAGE_TAG="${OS_VERSION}-${OS_VERSION_EXT}"
          fi
          echo "Docker Image Tag: $DOCKER_IMAGE_TAG"

          # Trigger Workflow
          echo "Triggering manual_update_develop workflow in NatLabRockies/docker-openstudio..."
          gh workflow run 'manual_update_develop' \
            --repo NatLabRockies/docker-openstudio \
            --ref develop \
            -f docker_image_tag="$DOCKER_IMAGE_TAG" \
            -f os_installer_link="$BINARY_URL" \
            -f os_version="$OS_VERSION" \
            -f os_version_ext="$OS_VERSION_EXT"

  macos-publish:
    name: Publish MacOS Artifacts
    needs: [macos-build]
    runs-on: ubuntu-latest
    if: *publish_if
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v8
        with:
          pattern: OS-Installers-macos-*
          merge-multiple: true
          path: installers

      - *configure_aws_credentials

      - name: Publish to S3
        working-directory: installers
        env:
          S3_PREFIX: ${{ github.ref_type == 'tag' && format('releases/{0}/signed', github.ref_name) || format('{0}/signed', github.ref_name) }}
        run: *s3_upload

  windows-publish:
    name: Publish Windows Artifacts
    needs: [windows-build]
    runs-on: ubuntu-latest
    if: *publish_if
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v8
        with:
          pattern: OS-Installers-windows-*
          merge-multiple: true
          path: installers

      - *configure_aws_credentials

      - name: Publish to S3
        working-directory: installers
        env:
          S3_PREFIX: ${{ github.ref_type == 'tag' && format('releases/{0}/signed', github.ref_name) || format('{0}/signed', github.ref_name) }}
        run: *s3_upload
