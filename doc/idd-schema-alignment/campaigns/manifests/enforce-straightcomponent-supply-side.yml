workflow: epmodel_campaign

change: |
  Enforce that StraightComponent types which belong only on the supply side of AirLoopHVAC
  explicitly preserve that supply-side-only context.

targets:
  include:
    - all straight components that belong only on the supply side of AirLoopHVAC

execution:
  backend: server
  work_item_grouping: type_family
  each_work_item: |
    Inspect one StraightComponent type family at a time and enforce supply-side-only behavior only where the code and tests justify it.
    Preserve legitimate exceptions and avoid broad refactors.
    Validate each completed family with:
    cmake --build "build" --target openstudio_epmodel -- -j32
    If that build fails because of this family, repair the issue before reporting success.
  after_all_work_items: |
    Run the broader validation pass:
    1. cmake --build "build" --target openstudio_epmodel_tests -- -j32
    2. If campaign-caused failures remain, do a focused final repair pass until the epmodel build/tests are green.
  resolution_agent:
    model: openai/gpt-5.4
    variant: high
  subject_agent:
    model: openai/gpt-5.1-codex-mini
    variant: medium
    parallelism: 1
  after_all_agent:
    model: openai/gpt-5.2
    variant: high

context:
  read:
    - doc/idd-schema-alignment/os_hvac_concepts.md
    - doc/idd-schema-alignment/os_idd_object_relationships.md
    - src/epmodel/StraightComponent/StraightComponent.cpp
    - src/epmodel/Loop/AirLoopHVAC.cpp
    - src/epmodel/HVACComponent/HVACComponent.cpp
  references:
    - src/epmodel/test/IDF_SmallOffice_GTest.cpp
    - src/epmodel/test/AirLoopHVAC_GTest.cpp
    - doc/idd-schema-alignment/idd_mapping.md
  notes: |
    Preserve legitimate non-supply exceptions only when the existing code and tests clearly justify them.
    Treat supply-side enforcement as the default expectation for this campaign, but do not force that policy onto families with explicit counterexamples.
    Prefer minimal family-local edits that improve semantic clarity, traversal behavior, and tests together.
    Use the reviewed resolution from plan/describe as the auditable starting set before any edits.
