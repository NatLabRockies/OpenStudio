workflow: epmodel_campaign

change: |
  Organize uncategorized concrete epmodel types currently living at the root of src/epmodel into the correct epmodel subdirectories.
  If an epmodel type has an openstudio::model equivalent, determine that model class's direct parent type and move the epmodel type into the matching epmodel directory.
  If an epmodel type has no openstudio::model equivalent, move it into ModelObject.
  Preserve class names, namespaces, and behavior. Update includes, source references, and tests as needed for each move.

targets:
  include:
    - src/epmodel/AvailabilityManagerAssignmentList.hpp
    - src/epmodel/AvailabilityManagerAssignmentList.cpp
    - src/epmodel/AvailabilityManagerAssignmentList_Impl.hpp
    - src/epmodel/ResourceObject/DesignSpecificationOutdoorAir.hpp
    - src/epmodel/ResourceObject/DesignSpecificationOutdoorAir.cpp
    - src/epmodel/ResourceObject/DesignSpecificationOutdoorAir_Impl.hpp
    - src/epmodel/NodeList.hpp
    - src/epmodel/NodeList.cpp
    - src/epmodel/NodeList_Impl.hpp
    - src/epmodel/OutdoorAirMixer.hpp
    - src/epmodel/OutdoorAirMixer.cpp
    - src/epmodel/OutdoorAirMixer_Impl.hpp
    - src/epmodel/SetpointManager/SetpointManagerMixedAir.hpp
    - src/epmodel/SetpointManager/SetpointManagerMixedAir.cpp
    - src/epmodel/SetpointManager/SetpointManagerMixedAir_Impl.hpp
    - src/epmodel/Splitter.hpp
    - src/epmodel/Splitter.cpp
    - src/epmodel/ZoneHVACAirDistributionUnit.hpp
    - src/epmodel/ZoneHVACAirDistributionUnit.cpp
    - src/epmodel/ZoneHVACAirDistributionUnit_Impl.hpp
    - src/epmodel/ModelObject/ZoneHVACEquipmentConnections.hpp
    - src/epmodel/ModelObject/ZoneHVACEquipmentConnections.cpp
    - src/epmodel/ModelObject/ZoneHVACEquipmentConnections_Impl.hpp

execution:
  backend: cli
  work_item_grouping: type_family
  each_work_item: |
    Move exactly one root-level epmodel type family into its reviewed destination subdirectory.
    Keep the class names, namespaces, and public API unchanged.
    Update includes, forward declarations, build references, and test/source paths required by the move.
    Validate the move before finishing the work item by running:
    cmake --build "build" --target openstudio_epmodel -- -j32
    If that build fails because of this move, repair the issue before reporting success.
  after_all_work_items: |
    Run the broader epmodel validation pass:
    1. cmake --build "build" --target openstudio_epmodel_tests -- -j32
    2. If campaign-caused failures remain, do a final repair pass until the epmodel build/tests are green.
  subject_agent:
    model: openai/gpt-5.1-codex-mini
    variant: minimal
    parallelism: 1

context:
  read:
    - doc/idd-schema-alignment/idd_mapping.md
  references:
    - src/model/AvailabilityManagerAssignmentList.hpp
    - src/model/DesignSpecificationOutdoorAir.hpp
    - src/model/SetpointManagerMixedAir.hpp
    - src/model/Splitter.hpp
  notes: |
    Use strict reviewed placement:
    AvailabilityManagerAssignmentList -> ModelObject
    DesignSpecificationOutdoorAir -> ResourceObject
    SetpointManagerMixedAir -> SetpointManager
    Splitter -> HVACComponent
    NodeList -> ModelObject
    OutdoorAirMixer -> ModelObject
    ZoneHVACAirDistributionUnit -> ModelObject
    ZoneHVACEquipmentConnections -> ModelObject
    For this campaign, do not use semantic placement overrides. If there is no direct openstudio::model equivalent, default to ModelObject.
